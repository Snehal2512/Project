<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 40px;
    }

    h1 {
      font-size: clamp(45px, 9vw, 90px);
      color: #fff;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
      animation: bounce 1.5s infinite;
    }

    h2 {
      margin-top: 15px;
      font-size: clamp(24px, 5vw, 45px);
      color: #fff;
    }

    p {
      margin: 20px 0;
      color: white;
      font-size: 20px;
    }

    .cake {
      font-size: 100px;
      margin: 25px 0;
      animation: cake 1s infinite alternate;
    }

    button {
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      background: #ff4081;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background: #e91e63;
    }

    /* Balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 70px;
      height: 90px;
      border-radius: 50%;
      animation: float 8s linear infinite;
      opacity: 0.9;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 120px;
      background: white;
      top: 88px;
      left: 50%;
    }

    .b1 {
      left: 10%;
      background: #ff5252;
      animation-delay: 0s;
    }

    .b2 {
      left: 30%;
      background: #42a5f5;
      animation-delay: 2s;
    }

    .b3 {
      left: 70%;
      background: #66bb6a;
      animation-delay: 1s;
    }

    .b4 {
      left: 88%;
      background: #ffca28;
      animation-delay: 3s;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 20px;
      background: #fff;
      animation: confetti 5s linear infinite;
    }

    .c1 { left: 15%; background: #ffeb3b; animation-delay: 1s; }
    .c2 { left: 35%; background: #00e5ff; animation-delay: 2s; }
    .c3 { left: 55%; background: #ff4081; animation-delay: 0s; }
    .c4 { left: 75%; background: #76ff03; animation-delay: 3s; }
    .c5 { left: 95%; background: #ffffff; animation-delay: 1.5s; }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes cake {
      from {
        transform: rotate(-5deg);
      }
      to {
        transform: rotate(5deg);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(-120vh) rotate(20deg);
      }
    }

    @keyframes confetti {
      0% {
        top: -30px;
        transform: rotate(0deg);
      }
      100% {
        top: 110vh;
        transform: rotate(720deg);
      }
    }

    .message {
      display: none;
      margin-top: 20px;
      font-size: 22px;
      color: white;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Confetti -->
  <div class="confetti c1"></div>
  <div class="confetti c2"></div>
  <div class="confetti c3"></div>
  <div class="confetti c4"></div>
  <div class="confetti c5"></div>

  <!-- Main Content -->
  <div class="container">
    <h1>🎉 Happy Birthday! 🎉</h1>

    <h2>Dear <span style="color:#ffeb3b;">Your Name</span> ❤️</h2>

    <div class="cake">🎂</div>

    <p>
      Wishing you a day filled with happiness,<br>
      laughter, love, and lots of wonderful memories! ✨
    </p>

    <button onclick="showMessage()">
      🎁 Click for a Surprise
    </button>

    <div class="message" id="message">
      💖 You are amazing! 💖<br>
      May all your dreams come true! 🌟
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";

      // Create extra confetti
      for (let i = 0; i < 50; i++) {
        let confetti = document.createElement("div");

        confetti.style.position = "fixed";
        confetti.style.width = "10px";
        confetti.style.height = "10px";
        confetti.style.background =
          ["#ff4081", "#ffeb3b", "#00e5ff", "#76ff03", "#ffffff"]
          [Math.floor(Math.random() * 5)];

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.zIndex = "10";

        document.body.appendChild(confetti);

        confetti.animate(
          [
            { transform: "translateY(0) rotate(0deg)" },
            {
              transform:
                `translateY(110vh) rotate(${Math.random() * 720}deg)`
            }
          ],
          {
            duration: 2000 + Math.random() * 3000,
            easing: "linear"
          }
        );

        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>

</body>
</html>
